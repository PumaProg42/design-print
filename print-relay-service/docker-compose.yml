version: '3.8'

services:
  print-relay:
    build: .
    container_name: zebra-print-relay
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    network_mode: host  # Use host network to access LAN printers
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
